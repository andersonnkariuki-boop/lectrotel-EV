<ion-content [fullscreen]="true" class="account-content">
  <div class="auth-container">
    <div class="form-heading">
      <span class="eyebrow">ACCOUNT MANAGEMENT</span>
      <h1>Create a new account</h1>
      <p>Add a new customer to the Lectrotel EV charging platform.</p>
    </div>

    <form (ngSubmit)="register()">
      <ion-item>
        <ion-label position="stacked">Full name</ion-label>
        <input
          type="text"
          placeholder="Enter your full name"
          [(ngModel)]="name"
          name="name"
          required
        />
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <input
          type="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Phone (optional)</ion-label>
        <input
          type="tel"
          placeholder="e.g. 0712 345 678"
          [(ngModel)]="phone"
          name="phone"
        />
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <input
          type="password"
          placeholder="Create a password (min 8 characters)"
          [(ngModel)]="password"
          name="password"
          required
        />
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Confirm password</ion-label>
        <input
          type="password"
          placeholder="Re-enter your password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
        />
      </ion-item>

      @if (showError) {
        <div class="error-message">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <div class="auth-actions">
        <ion-button expand="block" type="submit" [disabled]="loading">
          @if (loading) {
            <ion-spinner name="circular" slot="start"></ion-spinner>
            Creating Account...
          } @else {
            Register
          }
        </ion-button>
        <ion-button type="button" expand="block" fill="clear" (click)="goToLogin()">
          Cancel and return
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
