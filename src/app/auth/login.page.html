<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="auth-container">
    <h1>Charg-E Login</h1>
    <p>Sign in to access your EV charging workspace.</p>

    <form (ngSubmit)="login()">
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input 
          type="email" 
          placeholder="Enter your email" 
          [(ngModel)]="email"
          name="email"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input 
          type="password" 
          placeholder="Enter your password" 
          [(ngModel)]="password"
          name="password"
          required
        ></ion-input>
      </ion-item>

      @if (showError) {
        <div class="error-message">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <div class="auth-actions">
        <ion-button 
          expand="block" 
          type="submit"
          [disabled]="loading"
        >
          @if (loading) {
            <ion-spinner name="circular" slot="start"></ion-spinner>
            Signing In...
          } @else {
            Sign In
          }
        </ion-button>
        <ion-button expand="block" fill="outline" (click)="navigateToRegister()">
          Create Account
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
